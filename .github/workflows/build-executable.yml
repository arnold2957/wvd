name: Build Executable and Create Release

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 1: Extract version from source code and check if it's a pre-release.
    - name: Extract SemVer version from src\main.py
      id: extract-version
      shell: pwsh
      run: |
        $filePath = ".\src\main.py"
        if (-not (Test-Path -Path $filePath)) {
          Write-Error "File $filePath not found!"
          exit 1
        }

        $match = Select-String -Path $filePath -Pattern '__version__\s*=\s*[''"](\d+\.\d+\.\d+(-[a-zA-Z0-9.-]*)?)[''"]'
        
        if ($match -and $match.Matches.Groups.Count -gt 1) {
          $version = $match.Matches.Groups[1].Value
          $is_prerelease = $version.Contains("-")
          
          Write-Output "Extracted version: $version"
          Write-Output "Is pre-release: $is_prerelease"
          
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$is_prerelease" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "SemVer version pattern not found in $filePath"
          exit 1
        }

    # 判断本次推送是否更新了版本号 (与上一次提交比较 src/main.py 中的 __version__).
    # 普通 PR 合并推送即使没有改版本号也照常构建, 但不会向 QQ 群发通报.
    - name: Check if version was bumped
      id: check-version
      shell: pwsh
      run: |
        $version = "${{ steps.extract-version.outputs.version }}"
        $before = "${{ github.event.before }}"
        $changed = $false

        function Test-TagExists {
          $tag = git ls-remote --tags origin "refs/tags/$version"
          return [bool]$tag
        }

        if ($before -and $before -notmatch '^0{40}$') {
          git fetch --depth=1 origin $before 2>$null
          if ($LASTEXITCODE -eq 0) {
            $oldContent = git show "${before}:src/main.py" 2>$null
            if ($LASTEXITCODE -ne 0) { $oldContent = "" }
            $pattern = '__version__\s*=\s*[''"](\d+\.\d+\.\d+(-[a-zA-Z0-9.-]*)?)[''"]'
            $oldVersion = ([regex]::Match(($oldContent -join "`n"), $pattern)).Groups[1].Value
            Write-Output "Previous version: $oldVersion"
            if (-not $oldVersion) {
              # 旧提交里读不到版本号时, 退化为按标签是否已存在判断
              $changed = -not (Test-TagExists)
            } else {
              $changed = $oldVersion -ne $version
            }
          } else {
            Write-Output "无法获取上一次提交 $before, 改为检查标签是否存在"
            $changed = -not (Test-TagExists)
          }
        } else {
          Write-Output "没有可比较的上一次提交, 改为检查标签是否存在"
          $changed = -not (Test-TagExists)
        }

        if ($changed) { "version_changed=true" >> $env:GITHUB_OUTPUT }
        else { "version_changed=false" >> $env:GITHUB_OUTPUT }
        Write-Output "Version changed: $changed"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Compile translation catalogs
      run: |
        python -m babel.messages.frontend compile -d locale -D messages

    - name: Generate localized UI
      run: |
        python .github/scripts/build_ui.py --lang en_US

    - name: Build with PyInstaller
      run: |
        pyinstaller --onedir --noconsole `
          --hidden-import clr `
          --collect-all pythonnet `
          --collect-all clr_loader `
          --collect-all py7zr `
          --hidden-import bcj `
          --hidden-import inflate64 `
          --hidden-import pyppmd `
          --hidden-import multivolumefile `
          --hidden-import Cryptodome `
          --hidden-import brotli `
          --hidden-import backports.zstd `
          --collect-all webview `
          --add-data "resources;resources/" `
          --add-data "locale;locale/" `
          --add-data "src/ui.html;." `
          --add-data "build/ui/ui.en_US.html;." `
          src/main.py -n wvd
        Write-Host "Build completed successfully."

    - name: Compress build artifact to 7z
      shell: pwsh
      run: |
        $version = "${{ steps.extract-version.outputs.version }}"
        Copy-Item -Path './CHANGES_LOG.md' -Destination './dist/wvd/' -Force

        $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
        if (-not (Test-Path $sevenZip)) {
          $cmd = Get-Command 7z -ErrorAction SilentlyContinue
          if ($cmd) { $sevenZip = $cmd.Source }
        }
        if (-not $sevenZip) { throw "7-Zip not found on runner" }

        # 在 dist/wvd 目录内打包, 保证压缩包根目录就是程序文件 (不带 wvd/ 前缀)
        # 使用 BCJ 而不是 7-Zip 在 -mx=9 时默认选择的 BCJ2: py7zr 无法解压 BCJ2,
        # 两者压缩率几乎相同 (~0.5% 差异).
        Push-Location ./dist/wvd
        try {
          & $sevenZip a -t7z -m0=BCJ -m1=LZMA2 -mx=9 -mmt=on "../wvd_$version.7z" ".\*"
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
        } finally {
          Pop-Location
        }
        Get-ChildItem "dist/wvd_$version.7z"

    - name: Prepare Release Notes and Metadata
      id: prepare-release-meta
      shell: pwsh
      run: |
        $version = "${{ steps.extract-version.outputs.version }}"
        $archiveFileName = "wvd_$version.7z"
        $archivePath = "dist/$archiveFileName"
        $md5 = (Get-FileHash -Path $archivePath -Algorithm MD5).Hash.ToLower()
        echo "md5=$md5" >> $env:GITHUB_OUTPUT
        echo "MD5: $md5"
        
        $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss" -AsUTC

        $releaseContent = "**Version**: {0}`n**MD5**: ``{1}```n**Build Date**: {2}" -f $version, $md5, $date
        $releaseContent | Out-File -FilePath dist/release_notes.md -Encoding utf8

        # 客户端更新提示展示的内容: CHANGES_LOG.md 第一个 "###" 到第一个空行
        python .github/scripts/notify.py notes dist/update_notes.txt
        if ($LASTEXITCODE -ne 0) { throw "提取更新内容失败" }
        $notes = (Get-Content -Path dist/update_notes.txt -Raw -Encoding utf8).TrimEnd()

        $releaseData = @{
          version = $version
          md5 = $md5
          release_date = $date
          download_url = "https://github.com/${{ github.repository }}/releases/download/$version/$archiveFileName"
          release_notes = "https://github.com/${{ github.repository }}/releases/tag/$version"
          notes = $notes
        } | ConvertTo-Json

        New-Item -ItemType Directory -Path gh-pages -Force
        $releaseData | Out-File -FilePath gh-pages/release.json -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.extract-version.outputs.version }}
        name: Release ${{ steps.extract-version.outputs.version }}
        body_path: dist/release_notes.md
        files: dist/wvd_${{ steps.extract-version.outputs.version }}.7z

    - name: Force set as prerelease
      if: ${{ steps.extract-version.outputs.is_prerelease == 'true' }}
      uses: actions/github-script@v6
      with:
        script: |
          const release = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: '${{ steps.extract-version.outputs.version }}'
          });
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.data.id,
            prerelease: true
          });

    - name: Deploy to GitHub Pages
      if: ${{ steps.extract-version.outputs.is_prerelease == 'false' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        keep_files: false

    # Step 2: Notify the QQ group only when this push actually bumps the version.
    # Regular PR merges / code-only pushes still build and release, but stay silent.
    # Needs repository secrets: QQ_BOT_APP_ID, QQ_BOT_APP_SECRET, QQ_BOT_GROUP_OPENID.
    # Optional repository variables:
    #   QQ_BOT_SANDBOX=true  when the bot is not published yet
    #   QQ_BOT_AT_ALL=true/false  override @everyone behavior
    #                             (default: formal releases @everyone, beta does not)
    #   QQ_BOT_SEND_FILE=false     disable sending the release archive as a group file
    - name: Notify QQ group
      if: success() && steps.check-version.outputs.version_changed == 'true'
      continue-on-error: true
      env:
        QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
        QQ_BOT_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
        QQ_BOT_GROUP_OPENID: ${{ secrets.QQ_BOT_GROUP_OPENID }}
        QQ_BOT_SANDBOX: ${{ vars.QQ_BOT_SANDBOX }}
        QQ_BOT_AT_ALL: ${{ vars.QQ_BOT_AT_ALL }}
        QQ_BOT_SEND_FILE: ${{ vars.QQ_BOT_SEND_FILE }}
        RELEASE_ARCHIVE_PATH: dist/wvd_${{ steps.extract-version.outputs.version }}.7z
        RELEASE_ARCHIVE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.extract-version.outputs.version }}/wvd_${{ steps.extract-version.outputs.version }}.7z
        VERSION: ${{ steps.extract-version.outputs.version }}
      run: |
        python -m pip install --quiet qq-botpy
        python .github/scripts/notify.py send
