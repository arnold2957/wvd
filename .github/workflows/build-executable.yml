name: Build Executable and Create Release

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 1: Extract version from source code and check if it's a pre-release.
    - name: Extract SemVer version from src\main.py
      id: extract-version
      shell: pwsh
      run: |
        $filePath = ".\src\main.py"
        if (-not (Test-Path -Path $filePath)) {
          Write-Error "File $filePath not found!"
          exit 1
        }

        $match = Select-String -Path $filePath -Pattern '__version__\s*=\s*[''"](\d+\.\d+\.\d+(-[a-zA-Z0-9.-]*)?)[''"]'
        
        if ($match -and $match.Matches.Groups.Count -gt 1) {
          $version = $match.Matches.Groups[1].Value
          $is_prerelease = $version.Contains("-")
          
          Write-Output "Extracted version: $version"
          Write-Output "Is pre-release: $is_prerelease"
          
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$is_prerelease" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "SemVer version pattern not found in $filePath"
          exit 1
        }

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Compile translation catalogs
      run: |
        python -m babel.messages.frontend compile -d locale -D messages

    # ============================================================
    # DEBUG SECTION - all steps here use continue-on-error
    # so the release flow is not blocked.
    # ============================================================

    - name: DEBUG - Dump environment
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "===== Python version ====="
        python --version
        Write-Host ""
        Write-Host "===== pip freeze ====="
        pip freeze
        Write-Host ""
        Write-Host "===== Project tree (depth 2) ====="
        Get-ChildItem -Recurse -Depth 2 -Force |
          Where-Object { $_.FullName -notmatch '\\\.git\\' -and $_.FullName -notmatch '\\\.venv\\' } |
          Select-Object FullName

    - name: DEBUG - Show src file heads
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "===== src/gui.py (first 30 lines) ====="
        Get-Content ".\src\gui.py" -TotalCount 30 -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "===== src/script.py (first 30 lines) ====="
        Get-Content ".\src\script.py" -TotalCount 30 -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "===== src/main.py (first 15 lines) ====="
        Get-Content ".\src\main.py" -TotalCount 15 -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "===== src/utils.py (first 15 lines) ====="
        Get-Content ".\src\utils.py" -TotalCount 15 -ErrorAction SilentlyContinue

    - name: DEBUG - Build console exe with verbose logging
      shell: pwsh
      continue-on-error: true
      run: |
        pyinstaller --console --onedir --log-level DEBUG `
          --paths=src `
          --collect-submodules=ppadb `
          --add-data "resources;resources/" `
          --add-data "locale;locale/" `
          src/main.py -n wvd_debug 2>&1 | Tee-Object -FilePath build_debug.log
        Write-Host "Debug build completed (exit code $LASTEXITCODE)."

    - name: DEBUG - Dump warn file
      shell: pwsh
      continue-on-error: true
      run: |
        $warn = ".\build\wvd_debug\warn-wvd_debug.txt"
        if (-not (Test-Path $warn)) {
          Write-Host "=== warn file not found: $warn ==="
          exit 0
        }
        Write-Host "===== Full warn file ====="
        Get-Content $warn

    - name: DEBUG - Grep build log for script/ppadb
      shell: pwsh
      continue-on-error: true
      run: |
        if (-not (Test-Path ".\build_debug.log")) {
          Write-Host "=== build_debug.log not found ==="
          exit 0
        }
        Write-Host "===== Lines mentioning script / ppadb / utils / adb ====="
        Select-String -Path ".\build_debug.log" -Pattern "script|ppadb|utils|adb" |
          ForEach-Object { $_.Line }

    - name: DEBUG - List dist contents
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "===== dist\wvd_debug top-level ====="
        Get-ChildItem ".\dist\wvd_debug" -ErrorAction SilentlyContinue |
          Select-Object Name, Length
        Write-Host ""
        Write-Host "===== Search for 'script' files in dist ====="
        Get-ChildItem ".\dist\wvd_debug" -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match "script|utils|ppadb" } |
          Select-Object FullName
        Write-Host ""
        Write-Host "===== Search inside _internal (if onedir) ====="
        if (Test-Path ".\dist\wvd_debug\_internal") {
          Get-ChildItem ".\dist\wvd_debug\_internal" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "script|utils|ppadb" } |
            Select-Object FullName
        }

    - name: DEBUG - Run console exe and capture output
      shell: pwsh
      continue-on-error: true
      run: |
        $exe = ".\dist\wvd_debug\wvd_debug.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "=== EXE not found: $exe ==="
          exit 0
        }
        $p = Start-Process -FilePath $exe -NoNewWindow -PassThru `
             -RedirectStandardOutput out.txt -RedirectStandardError err.txt
        if (-not $p.WaitForExit(20000)) {
          Write-Host "=== Process still running after 20s, killing it ==="
          $p.Kill()
        }
        Write-Host "=== Exit code: $($p.ExitCode) ==="
        Write-Host ""
        Write-Host "===== STDOUT ====="
        Get-Content out.txt -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "===== STDERR ====="
        Get-Content err.txt -ErrorAction SilentlyContinue

    # ============================================================
    # RELEASE BUILD
    # ============================================================

    - name: Diagnose - try import script directly
      shell: pwsh
      continue-on-error: true
      run: |
        cd src
        python -c "import script; print('script import OK')"
      
    - name: Build with PyInstaller
      run: |
        pyinstaller --onedir `
          --paths=src `
          --collect-submodules=ppadb `
          --add-data "resources;resources/" `
          --add-data "locale;locale/" `
          src/main.py -n wvd
        Write-Host "Build completed successfully."

    - name: Compress build artifact to ZIP
      shell: pwsh
      run: |
        $version = "${{ steps.extract-version.outputs.version }}"
        Copy-Item -Path './CHANGES_LOG.md' -Destination './dist/wvd/' -Force
        Compress-Archive -Path ./dist/wvd/* -DestinationPath "./dist/wvd_$version.zip" -Force
        Get-ChildItem "dist/wvd_$version.zip"

    - name: Prepare Release Notes and Metadata
      id: prepare-release-meta
      shell: pwsh
      run: |
        $version = "${{ steps.extract-version.outputs.version }}"
        $zipFileName = "wvd_$version.zip"
        $zipPath = "dist/$zipFileName"
        $md5 = (Get-FileHash -Path $zipPath -Algorithm MD5).Hash.ToLower()
        echo "md5=$md5" >> $env:GITHUB_OUTPUT
        echo "MD5: $md5"
        
        $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss" -AsUTC

        $releaseContent = "**Version**: {0}`n**MD5**: ``{1}```n**Build Date**: {2}" -f $version, $md5, $date
        $releaseContent | Out-File -FilePath dist/release_notes.md -Encoding utf8

        $releaseData = @{
          version = $version
          md5 = $md5
          release_date = $date
          download_url = "https://github.com/${{ github.repository }}/releases/download/$version/$zipFileName"
          release_notes = "https://github.com/${{ github.repository }}/releases/tag/$version"
        } | ConvertTo-Json

        New-Item -ItemType Directory -Path gh-pages -Force
        $releaseData | Out-File -FilePath gh-pages/release.json -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.extract-version.outputs.version }}
        name: Release ${{ steps.extract-version.outputs.version }}
        body_path: dist/release_notes.md
        files: dist/wvd_${{ steps.extract-version.outputs.version }}.zip

    - name: Force set as prerelease
      if: ${{ steps.extract-version.outputs.is_prerelease == 'true' }}
      uses: actions/github-script@v6
      with:
        script: |
          const release = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: '${{ steps.extract-version.outputs.version }}'
          });
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.data.id,
            prerelease: true
          });

    - name: Deploy to GitHub Pages
      if: ${{ steps.extract-version.outputs.is_prerelease == 'false' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        keep_files: false
